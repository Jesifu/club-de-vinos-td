<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="649px" preserveAspectRatio="none" style="width:1367px;height:649px;background:#FFFFFF;" version="1.1" viewBox="0 0 1367 649" width="1367px" zoomAndPan="magnify"><title>Patr&#243;n Singleton &#8212; SessionManager e IdiomaManager (SeguridadYServicios)</title><defs/><g><g class="title" data-source-line="7"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="608.959" x="375.2705" y="22.9951">Patr&#243;n Singleton &#8212; SessionManager e IdiomaManager (SeguridadYServicios)</text></g><!--cluster SeguridadYServicios--><g class="cluster" data-qualified-name="SeguridadYServicios" data-source-line="9" id="ent0002"><rect fill="#F4E8E8" height="287" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.5;" width="759" x="167.5" y="180.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="162.3535" x="465.8232" y="195.292">SeguridadYServicios</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="48" id="ent0006"><path d="M351.5,49.2969 L351.5,119.8281 A0,0 0 0 0 351.5,119.8281 L528.9195,119.8281 L666.3428,207.1868 L536.9195,119.8281 L721.4053,119.8281 A0,0 0 0 0 721.4053,119.8281 L721.4053,59.2969 L711.4053,49.2969 L351.5,49.2969 A0,0 0 0 0 351.5,49.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M711.4053,49.2969 L711.4053,59.2969 L721.4053,59.2969 L711.4053,49.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="146.7896" x="357.5" y="66.3638">Constructor privado</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="5.0718" x="508.4219" y="66.3638">(</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="187.8398" x="513.4937" y="66.3638">private&#160;SessionManager()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="5.0718" x="701.3335" y="66.3638">)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.5527" x="357.5" y="81.4966">Impide instanciar la clase con</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="23.48" x="555.1851" y="81.4966">new</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="39.2729" x="582.7974" y="81.4966">desde</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.0996" x="357.5" y="96.6294">fuera de ella misma: la &#250;nica forma de obtener</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.8662" x="357.5" y="111.7622">un objeto es a trav&#233;s de</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="101.7466" x="519.4985" y="111.7622">getInstance()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="621.2451" y="111.7622">.</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="55" id="ent0009"><path d="M6,57.2969 L6,112.6953 A0,0 0 0 0 6,112.6953 L190.1162,112.6953 L288.0477,215.0978 L198.1162,112.6953 L333.2935,112.6953 A0,0 0 0 0 333.2935,112.6953 L333.2935,67.2969 L323.2935,57.2969 L6,57.2969 A0,0 0 0 0 6,57.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M323.2935,57.2969 L323.2935,67.2969 L333.2935,67.2969 L323.2935,57.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.2319" x="12" y="74.3638">Misma estructura que</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="109.5732" x="158.3643" y="74.3638">SessionManager</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.3799" x="267.9375" y="74.3638">:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246.4604" x="12" y="89.4966">constructor privado + campo est&#225;tico</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="10.8926" x="12" y="104.6294">+</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="101.7466" x="27.0249" y="104.6294">getInstance()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.3896" x="132.9038" y="104.6294">con double-checked locking.</text></g><g class="entity" data-qualified-name="N_instance" data-source-line="61" id="ent0011"><path d="M577,533.7969 L577,604.3281 L918.436,604.3281 L918.436,543.7969 L908.436,533.7969 L577,533.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M908.436,533.7969 L908.436,543.7969 L918.436,543.7969 L908.436,533.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.6895" x="583" y="550.8638">Campo est&#225;tico</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="70.4399" x="688.8218" y="550.8638">_instance</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.3799" x="759.2617" y="550.8638">:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.7061" x="583" y="565.9966">guarda la &#250;nica instancia de la clase,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.6895" x="583" y="581.1294">compartida por toda la aplicaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.436" x="583" y="596.2622">(una sola sesi&#243;n / un solo idioma activo a la vez).</text></g><g class="entity" data-qualified-name="N_dcl" data-source-line="70" id="ent0014"><path d="M232.5,496.2969 L232.5,642.4922 L558.6128,642.4922 L558.6128,506.2969 L548.6128,496.2969 L232.5,496.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M548.6128,496.2969 L548.6128,506.2969 L558.6128,506.2969 L548.6128,496.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="174.4844" x="238.5" y="513.3638">Double-checked locking</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.2373" x="417.1167" y="513.3638">en</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="101.7466" x="437.4863" y="513.3638">getInstance()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.3799" x="539.2329" y="513.3638">:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="27.8599" x="246.7646" y="528.4966">1) si</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="133.0532" x="278.7568" y="528.4966">_instance&#160;==&#160;null</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="69.2593" x="415.9424" y="528.4966">se entra al</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="31.3066" x="489.334" y="528.4966">lock</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.3799" x="520.6406" y="528.4966">;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="84.354" x="246.7646" y="543.6294">2) dentro del</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="31.3066" x="335.251" y="543.6294">lock</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.3877" x="370.6899" y="543.6294">se vuelve a chequear null</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.9302" x="259.1616" y="558.7622">(otro hilo pudo haberla creado mientras</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.021" x="259.1616" y="573.895">se esperaba el lock);</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.8838" x="246.7646" y="589.0278">3) reci&#233;n ah&#237; se crea la instancia.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.6514" x="238.5" y="604.1606">Evita instancias duplicadas en escenarios</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.7944" x="238.5" y="619.2935">multi-hilo sin pagar el costo del</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="31.3066" x="447.4268" y="619.2935">lock</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.4653" x="238.5" y="634.4263">en cada llamada posterior.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="84" id="ent0018"><path d="M936,533.7969 L936,604.3281 A0,0 0 0 0 936,604.3281 L1283.1045,604.3281 A0,0 0 0 0 1283.1045,604.3281 L1283.1045,543.7969 L1273.1045,533.7969 L1064.1919,533.7969 L918.1149,434.2127 L1056.1919,533.7969 L936,533.7969 A0,0 0 0 0 936,533.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1273.1045,533.7969 L1273.1045,543.7969 L1283.1045,543.7969 L1273.1045,533.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.3989" x="942" y="550.8638">Particularidad de este Singleton:</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="109.5732" x="1158.5313" y="550.8638">cerrarSesion()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.4429" x="942" y="565.9966">pone</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="70.4399" x="978.5752" y="565.9966">_instance</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.2373" x="1053.1475" y="565.9966">en</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="31.3066" x="1073.5171" y="565.9966">null</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.8765" x="1104.8237" y="565.9966">, por lo que el</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.4727" x="942" y="581.1294">pr&#243;ximo</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="101.7466" x="999.605" y="581.1294">getInstance()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.8184" x="1105.4839" y="581.1294">crea una instancia</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.5103" x="942" y="596.2622">nueva (singleton "reseteable" entre sesiones).</text></g><!--class LogIn--><g class="entity" data-qualified-name="LogIn" data-source-line="94" id="ent0020"><rect fill="#F1F