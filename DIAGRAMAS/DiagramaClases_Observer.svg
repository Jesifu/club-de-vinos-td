<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="674px" preserveAspectRatio="none" style="width:1864px;height:674px;background:#FFFFFF;" version="1.1" viewBox="0 0 1864 674" width="1864px" zoomAndPan="magnify"><title>Patr&#243;n Observer &#8212; Cambio de idioma (SeguridadYServicios / CAPAS)</title><defs/><g><g class="title" data-source-line="7"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="542.1514" x="657.4243" y="22.9951">Patr&#243;n Observer &#8212; Cambio de idioma (SeguridadYServicios / CAPAS)</text></g><!--cluster SeguridadYServicios--><g class="cluster" data-qualified-name="SeguridadYServicios" data-source-line="9" id="ent0002"><rect fill="#F4E8E8" height="405.5" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.5;" width="456" x="722" y="207.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="162.3535" x="868.8232" y="222.292">SeguridadYServicios</text></g><!--cluster CAPAS--><g class="cluster" data-qualified-name="CAPAS" data-source-line="28" id="ent0005"><rect fill="#FEFECE" height="156" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.5;" width="310" x="1532" y="240.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="52.2881" x="1660.856" y="255.292">CAPAS</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="47" id="ent0010"><path d="M792,49.2969 L792,180.3594 A0,0 0 0 0 792,180.3594 L946,180.3594 L950,234.2228 L954,180.3594 L1108.1343,180.3594 A0,0 0 0 0 1108.1343,180.3594 L1108.1343,59.2969 L1098.1343,49.2969 L792,49.2969 A0,0 0 0 0 792,49.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1098.1343,49.2969 L1098.1343,59.2969 L1108.1343,59.2969 L1098.1343,49.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="55.1167" x="798" y="66.3638">Subject</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.0454" x="853.1167" y="66.3638">: mantiene la lista de observadores</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.5703" x="798" y="81.4966">registrados (</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="78.2666" x="880.5703" y="81.4966">_observers</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.9487" x="958.8369" y="81.4966">) y el estado que les</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="62.2324" x="798" y="96.6294">interesa (</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="101.7466" x="860.2324" y="96.6294">_traducciones</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120.8594" x="966.1113" y="96.6294">del idioma activo).</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="70.4399" x="798" y="111.7622">Registrar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.3799" x="868.4399" y="111.7622">/</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="93.9199" x="872.8198" y="111.7622">Desregistrar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="111.6426" x="970.8721" y="111.7622">agregan o quitan</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.9492" x="798" y="126.895">un Form de la lista. Es adem&#225;s un</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="70.0527" x="1023.0815" y="126.895">Singleton</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.1465" x="798" y="142.0278">(ver diagrama dedicado), por lo que toda la</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.1587" x="798" y="157.1606">aplicaci&#243;n comparte la misma lista de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.4346" x="798" y="172.2935">observadores.</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="58" id="ent0013"><path d="M1187.5,277.2969 L1187.5,378.0938 A0,0 0 0 0 1187.5,378.0938 L1296.1195,378.0938 L1122.1869,539.458 L1304.1195,378.0938 L1522.4614,378.0938 A0,0 0 0 0 1522.4614,378.0938 L1522.4614,287.2969 L1512.4614,277.2969 L1187.5,277.2969 A0,0 0 0 0 1187.5,277.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1512.4614,277.2969 L1512.4614,287.2969 L1522.4614,287.2969 L1512.4614,277.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="67.0249" x="1193.5" y="294.3638">Observer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.5518" x="1260.5249" y="294.3638">: interfaz m&#237;nima que deben</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.1084" x="1193.5" y="309.4966">implementar los Forms para recibir el</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.3071" x="1193.5" y="324.6294">aviso de cambio de idioma. Un solo m&#233;todo,</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="140.8799" x="1193.5" y="339.7622">ActualizarIdioma()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.2246" x="1334.3799" y="339.7622">, sin par&#225;metros: cada</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="121.9893" x="1193.5" y="354.895">Form vuelve a leer</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="187.8398" x="1319.6216" y="354.895">IdiomaManager.Traducir()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.4561" x="1193.5" y="370.0278">para refrescar sus controles.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="67" id="ent0016"><path d="M1516,476.2969 L1516,667.8906 A0,0 0 0 0 1516,667.8906 L1857.7534,667.8906 A0,0 0 0 0 1857.7534,667.8906 L1857.7534,486.2969 L1847.7534,476.2969 L1691,476.2969 L1687,388.4296 L1683,476.2969 L1516,476.2969 A0,0 0 0 0 1516,476.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1847.7534,476.2969 L1847.7534,486.2969 L1857.7534,486.2969 L1847.7534,476.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="132.7168" x="1522" y="493.3638">ConcreteObserver</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.6699" x="1654.7168" y="493.3638">: cada Form que debe</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.1108" x="1522" y="508.4966">reaccionar al cambio de idioma:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="25.0605" x="1522" y="523.6294">- en</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="31.3066" x="1551.1929" y="523.6294">Load</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.6528" x="1582.4995" y="523.6294">: ""IdiomaManager.getInstance()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.4175" x="1530.2646" y="538.7622">.Registrar(this)</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="54.7866" x="1635.5088" y="538.7622">y&#160;luego</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.0854" x="1698.1221" y="538.7622">ActualizarIdioma()""</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="249.7358" x="1530.2646" y="553.895">(para aplicar el idioma activo al abrir).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="25.0605" x="1522" y="569.0278">- en</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="78.2666" x="1551.1929" y="569.0278">FormClosed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.3799" x="1629.4595" y="569.0278">:</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="164.3599" x="1637.9717" y="569.0278">...Desregistrar(this)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.0972" x="1530.2646" y="584.1606">para no quedar referenciado tras cerrarse.</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="140.8799" x="1522" y="599.2935">ActualizarIdioma()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="47.1313" x="1667.0122" y="599.2935">recorre</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="78.2666" x="1718.2759" y="599.2935">_controles</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.6934" x="1800.6748" y="599.2935">y</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="38.5557" x="1522" y="614.4263">aplica</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="273.9331" x="1564.688" y="614.4263">Traducir(clave)&#160;??&#160;_defaults[clave]</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="1838.6211" y="614.4263">.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.2544" x="1522" y="629.5591">Si el Form tiene</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="93.9199" x="1628.3867" y="629.5591">DataGridView</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.0449" x="1722.3066" y="629.5591">, tambi&#233;n llama</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="180.0132" x="1522" y="644.6919">ActualizarEncabezados()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.2944" x="1706.1455" y="644.6919">(los encabezados de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.7222" x="1522" y="659.8247">columna no est&#225;n en</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="62.6133" x="1662.8545" y="659.8247">Controls</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="9.2041" x="1725.4678" y="659.8247">).</text></g><g class="entity" data-qualified-name="N_notificar" data-source-line="82" id="ent0018"><path d="M6,529.2969 L6,614.9609 A0,0 0 0 0 6,614.9609 L329.5356,614.9609 A0,0 0 0 0 329.5356,614.9609 L329.5356,539.2969 L319.5356,529.2969 L237.7733,529.2969 L730.3716,366.8481 L229.7733,529.2969 L6,529.2969 A0,0 0 0 0 6,529.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M319.5356,529.2969 L319.5356,539.2969 L329.5356,539.2969 L319.5356,529.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="86.0933" x="12" y="546.3638">Notificar()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="139.0581" x="102.2256" y="546.3638">(privado) recorre una</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="39.1714" x="245.416" y="546.3638">copia</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.25" x="12" y="561.4966">de</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="78.2666" x="32.3823" y="561.4966">_observers</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="54.7422" x="114.7813" y="561.4966">e invoca</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="140.8799" x="173.6558" y="561.4966">ActualizarIdioma()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.9639" x="12" y="576.6294">en cada uno. Se llama al final de</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="117.3999" x="12" y="591.7622">CambiarIdioma()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.8979" x="129.3999" y="591.7622">, una vez actualizados</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="101.7466" x="12" y="606.895">_idiomaActivo</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7.6934" x="117.8789" y="606.895">y</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="101.7466" x="129.7046" y="606.895">_traducciones</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="231.4512" y="606.895">.</text></g><g class="entity" data-qualified-name="N_flujo" data-source-line="91" id="ent0020"><path d="M348.5,514.2969 L348.5,630.2266 A0,0 0 0 0 348.5,630.2266 L713.3716,630.2266 A0,0 0 0 0 713.3716,630.2266 L713.3716,524.2969 L703.3716,514.2969 L633.6773,514.2969 L790.0997,421.3406 L625.6773,514.2969 L348.5,514.2969 A0,0 0 0 0 348.5,514.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M703.3716,514.2969 L703.3716,524.2969 L713.3716,524.2969 L703.3716,514.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="119.9136" x="354.5" y="531.3638">Flujo disparador</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.6865" x="478.5459" y="531.3638">(no forma parte del</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.3867" x="354.5" y="546.4966">patr&#243;n, pero da contexto): el usuario elige</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.6377" x="354.5" y="561.6294">un idioma en el selector agregado por</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="281.7598" x="354.5" y="576.7622">IdiomaUIHelper.AgregarSelector(form)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="57